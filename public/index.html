<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f2ff00">
    <meta name="description" content="CueStarter.com: fast mobile conversation starters in English and Spanish.">
    <title>CueStarter.com</title>
    <link rel="stylesheet" href="/styles.css?v=19">
  </head>
  <body>
    <main class="app-shell">
      <header id="topbar" class="topbar">
        <div>
          <p class="kicker">CueStarter.com</p>
          <h1 id="screenTitle">CueStarter</h1>
        </div>
        <div class="language-switch" aria-label="Language">
          <button class="mini active" data-lang="en" type="button">EN</button>
          <button class="mini" data-lang="es" type="button">ES</button>
        </div>
      </header>

      <section id="setupPanel" class="setup-panel" aria-live="polite">
        <div class="section-head">
          <span id="setupTitle">Set the vibe</span>
          <span id="setupStep">1/3</span>
        </div>
        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
        <div id="setupGrid" class="choice-grid"></div>
        <div class="step-actions">
          <button id="setupBackBtn" class="thin-btn" type="button">Back</button>
          <button id="startBtn" class="ai-btn" type="button">Start</button>
        </div>
      </section>

      <section id="cuePanel" class="cue-panel" hidden>
        <div class="section-head">
          <span id="cueLabel">Say this</span>
          <button id="newBtn" class="thin-btn" type="button">New</button>
        </div>
        <div id="starterGrid" class="starter-grid"></div>
        <button id="moreStartersBtn" class="flip-btn" type="button">More</button>
        <button id="primaryCue" class="primary-cue" type="button"></button>
        <button id="flipBtn" class="flip-btn" type="button">Coach</button>
        <p id="cueIntent" class="cue-intent"></p>
        <div id="waitToast" class="wait-toast" hidden>Wait a second...</div>
        <div id="freshGrid" class="fresh-grid"></div>
        <div id="actionGrid" class="action-grid"></div>
        <div class="quick-nav">
          <button id="showTopicsBtn" class="nav-btn" type="button">Change topic</button>
          <button id="showFreshBtn" class="nav-btn" type="button">Ready next</button>
        </div>
        <section id="topicPanel" class="drawer-panel" hidden>
          <div class="section-head topic-head">
            <span id="topicTitle">Change topic</span>
            <button id="wildBtn" class="thin-btn" type="button">Random</button>
          </div>
          <div id="topicGrid" class="topic-grid"></div>
        </section>
        <div class="bottom-actions">
          <button id="resetBtn" class="thin-btn" type="button">Reset</button>
        </div>
      </section>
    </main>
    <script src="/app.js?v=19" defer></script>
  </body>
</html>
